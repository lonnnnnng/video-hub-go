<!doctype html>
<html lang="zh-CN">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><meta name="theme-color" content="#20343b"><title>下载队列 · 片库</title><link rel="stylesheet" href="/style.css"><script src="/app.js" defer></script><script src="/jobs.js" defer></script></head>
<body data-page="jobs">
  <aside class="sidebar"><a class="brand" href="/" aria-label="片库首页"><span class="brand-mark" aria-hidden="true">▣</span><span>片库<small>Movie Hub</small></span></a><nav aria-label="主导航"><a href="/"><span aria-hidden="true">⌂</span>首页</a><a href="/follows.html"><span aria-hidden="true">◷</span>我的追更</a><a href="/jobs.html" class="selected" aria-current="page"><span aria-hidden="true">↓</span>下载队列 <span id="queueCount" class="nav-count"></span></a><a href="/sources.html"><span aria-hidden="true">◈</span>资源站</a><a href="/settings.html"><span aria-hidden="true">⚙</span>服务设置</a></nav><div class="sidebar-bottom"><p>让喜欢的剧集<br>有一个自己的片库。</p></div></aside>
  <main class="workspace"><p id="notice" class="notice" role="status" hidden></p><section class="page"><div class="section-head"><h2>全部任务</h2><label class="inline-field">筛选<select id="jobFilter"><option value="">全部任务</option><option value="active">进行中</option><option value="completed">已入库</option><option value="failed">失败</option><option value="paused">暂停</option><option value="canceled">已取消</option></select></label></div><div id="jobList" class="stack-list"></div></section></main>
  <dialog id="localPlayerDialog" class="local-player-dialog" aria-labelledby="localPlayerTitle">
    <header class="dialog-top"><h2 id="localPlayerTitle">已下载视频</h2><button id="closeLocalPlayer" type="button" aria-label="关闭播放器">关闭</button></header>
    <video id="localVideo" controls playsinline preload="metadata" aria-label="已下载视频播放器"></video>
    <p id="localPlayerStatus" class="field-hint" role="status"></p>
  </dialog>
  <dialog id="deleteJobDialog" class="delete-job-dialog" aria-labelledby="deleteJobTitle" aria-describedby="deleteJobHint">
    <h2 id="deleteJobTitle">删除任务</h2>
    <p id="deleteJobHint">删除记录前会停止下载。默认保留所有文件。</p>
    <label class="check delete-files-choice"><input id="deleteFiles" type="checkbox">同时删除下载的文件</label>
    <p class="field-hint">勾选后会永久删除本集 MP4、分集 NFO、入库收据及临时分片，其他集不受影响。</p>
    <p id="deleteJobError" class="error-text" role="alert" hidden></p>
    <footer class="actions"><button id="cancelDeleteJob" type="button" autofocus>返回</button><button id="confirmDeleteJob" class="danger-button" type="button">确认删除</button></footer>
  </dialog>
</body>
</html>
