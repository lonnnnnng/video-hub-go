<!doctype html>
<html lang="zh-CN">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><meta name="theme-color" content="#20343b"><title>服务设置 · 片库</title><link rel="stylesheet" href="/style.css"><script src="/app.js" defer></script></head>
<body data-page="settings">
  <aside class="sidebar"><a class="brand" href="/" aria-label="片库首页"><span class="brand-mark" aria-hidden="true">▣</span><span>片库<small>Movie Hub</small></span></a><nav aria-label="主导航"><a href="/"><span aria-hidden="true">⌂</span>首页</a><a href="/follows.html"><span aria-hidden="true">◷</span>我的追更</a><a href="/jobs.html"><span aria-hidden="true">↓</span>下载队列 <span id="queueCount" class="nav-count"></span></a><a href="/sources.html"><span aria-hidden="true">◈</span>资源站</a><a href="/settings.html" class="selected" aria-current="page"><span aria-hidden="true">⚙</span>服务设置</a></nav><div class="sidebar-bottom"><p>让喜欢的剧集<br>有一个自己的片库。</p><button id="access" type="button">访问令牌</button></div></aside>
  <main class="workspace"><p id="notice" class="notice" role="status" hidden></p><section class="page"><form id="settingsForm" class="settings-form"><div class="settings-block"><div class="block-heading"><h2>下载与媒体文件</h2><p>媒体目录需与 Emby 共享，Emby 媒体库类型选择“电视节目”。</p></div><div class="fields"><label class="wide">媒体目录<input name="mediaDir" required></label><label>FFmpeg 路径<input name="ffmpeg" required></label><label>FFprobe 路径<input name="ffprobe" required></label><label>同时下载<input name="workers" type="number" min="1" max="6" required></label><label>每集分片线程<input name="threads" type="number" min="1" max="32" required></label><label>最多尝试次数<input name="maxAttempts" type="number" min="1" max="10" required></label><label>追更间隔（分钟）<input name="checkMinutes" type="number" min="1" max="1440" required></label></div><p id="toolStatus" class="field-hint"></p></div><div class="settings-block"><div class="block-heading"><h2>Emby 自动入库</h2><p>下载完成后请求 Emby 扫描媒体库。</p></div><label class="check"><input name="embyEnabled" type="checkbox">启用自动扫描</label><div class="fields"><label>Emby 服务器地址<input name="embyUrl" type="url" placeholder="http://192.168.1.2:8096"></label><label>管理员 API Key<input name="embyKey" type="password" autocomplete="new-password" placeholder="留空保留已保存的密钥"></label></div><label class="check"><input name="clearEmbyKey" type="checkbox">清除已保存的 API Key</label><p id="embyStatus" class="field-hint"></p><button type="button" id="scanEmby">请求扫描媒体库</button></div><div class="form-footer"><span>设置保存在本机 JSON 文件中。</span><button class="primary" type="submit">保存设置</button></div></form></section></main>
  <dialog id="accessDialog" class="access-dialog"><h2>访问令牌</h2><p>远程访问时请输入服务启动时配置的令牌。</p><form id="accessForm"><label>令牌<input id="token" type="password" autocomplete="off"></label><div class="actions"><button id="closeAccess" type="button">取消</button><button class="primary" type="submit">连接服务</button></div></form></dialog>
</body>
</html>
